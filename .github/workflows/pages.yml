name: Pubblica demo Bealab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Prepara Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Leggi la configurazione GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Installa le dipendenze
        run: npm ci --no-audit --no-fund
      - name: Compila la demo
        run: npm run build
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - name: Prepara il sito per la pubblicazione
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pubblica il sito
        id: deployment
        uses: actions/deploy-pages@v4
